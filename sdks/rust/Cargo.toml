[package]
name = "lumenvec-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for the LumenVec versioned HTTP API"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
